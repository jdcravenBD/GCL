<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCL — Guitar Parts Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-left">
    <div class="brand">
      <span class="mark"></span>
      <strong>GCL</strong>
      <span class="sub">Guitar Part Checklist</span>
    </div>

    <div class="board-name">
      <span class="bn-label">Board name</span>
      <input id="board-name" type="text" placeholder="Untitled board" spellcheck="false">
    </div>
  </div>

  <div class="bar-actions">
    <button id="add" class="btn primary">+ Add part</button>
    <div class="group">
      <button id="undo" class="btn icon" title="Undo (Ctrl+Z)">&#8630;</button>
      <button id="redo" class="btn icon" title="Redo (Ctrl+Y)">&#8631;</button>
    </div>
    <div class="group">
      <button id="zoom-out" class="btn icon" title="Zoom out">&minus;</button>
      <button id="zoom-reset" class="btn" title="Reset view">100%</button>
      <button id="zoom-in" class="btn icon" title="Zoom in">+</button>
    </div>
    <div class="total" title="Sum of all part prices">
      <span class="total-label">Build total</span>
      <span class="total-line">
        <span id="total">$0.00</span>
        <span class="total-of">of</span>
        <input id="budget" type="text" inputmode="decimal" placeholder="budget"
               aria-label="Budget" spellcheck="false">
      </span>
      <span class="budget-bar"><span class="budget-fill" id="budget-fill"></span></span>
    </div>
    <button id="summary-toggle" class="btn">Summary</button>
    <div class="group">
      <button id="export" class="btn" title="Save the whole board as a file you can re-import">Export</button>
      <button id="import" class="btn">Import</button>
      <button id="clear" class="btn danger">Clear</button>
    </div>

    <span class="bar-sep"></span>

    <!-- Dev-only typeface switcher. Each button previews its own face. -->
    <div class="group fonts" title="Typeface (dev)">
      <button class="btn font-btn" data-font="ui">Segoe</button>
      <button class="btn font-btn" data-font="inter">Inter</button>
      <button class="btn font-btn" data-font="plex">Plex</button>
      <button class="btn font-btn" data-font="grotesk">Grotesk</button>
      <button class="btn font-btn" data-font="mono">Mono</button>
    </div>
  </div>
</header>

<main id="stage">
  <div id="world">
    <!-- Connection wires. Lives inside #world so it pans and zooms with the
         cards, and sits behind them in stacking order. -->
    <svg id="wires"></svg>
  </div>
  <div id="empty" class="empty-hint">
    <p class="eh-lead">Start from a template, or just <button type="button" id="eh-blank" class="eh-link">add a part</button>.</p>
    <div class="tpl-grid" id="tpl-grid"></div>
    <p class="eh-tip">Drag the background to pan &middot; Scroll to zoom</p>
  </div>

  <!-- Ctrl/Shift-drag marquee. Visual only for now. -->
  <div id="marquee"></div>
</main>

<!-- Parts list, grouped. Slides over the canvas from the right. -->
<aside id="summary" class="summary" aria-label="Parts summary">
  <div class="sum-head">
    <strong>Summary</strong>
    <button type="button" id="sum-close" class="link-btn">Close</button>
  </div>

  <div class="sum-totals">
    <div class="sum-stat"><span class="sum-k">Parts</span><span class="sum-v" id="sum-parts">0</span></div>
    <div class="sum-stat"><span class="sum-k">Items</span><span class="sum-v" id="sum-items">0</span></div>
    <div class="sum-stat"><span class="sum-k">Total</span><span class="sum-v" id="sum-total">$0.00</span></div>
    <div class="sum-stat" id="sum-left-stat" hidden>
      <span class="sum-k" id="sum-left-k">Left</span><span class="sum-v" id="sum-left">—</span>
    </div>
  </div>

  <div class="seg" id="sum-group">
    <button type="button" class="seg-btn on" data-group="vendor">Vendor</button>
    <button type="button" class="seg-btn" data-group="type">Type</button>
    <button type="button" class="seg-btn" data-group="status">Status</button>
  </div>

  <div class="sum-list" id="sum-list"></div>

  <div class="sum-foot">
    <span class="sum-k">Prices</span>
    <div class="sum-exports">
      <span class="recheck-note" id="recheck-note"></span>
      <button type="button" class="link-btn" id="recheck">Re-check</button>
    </div>
  </div>

  <div class="sum-foot">
    <span class="sum-k">Export list</span>
    <div class="sum-exports">
      <button type="button" class="link-btn" data-export="md">Markdown</button>
      <button type="button" class="link-btn" data-export="csv">CSV</button>
      <button type="button" class="link-btn" data-export="copy">Copy</button>
    </div>
  </div>

  <div class="sum-foot">
    <span class="sum-k">Share</span>
    <div class="sum-exports">
      <span class="recheck-note" id="share-note"></span>
      <button type="button" class="link-btn" id="share">Create link</button>
    </div>
  </div>
</aside>

<!-- Share result: the link plus a copy action, same popup shell as the rest. -->
<div id="share-pop" class="confirm paste-pop">
  <input class="pp-input" id="share-url" type="text" readonly spellcheck="false">
  <button type="button" class="link-btn" id="share-copy">Copy</button>
  <button type="button" class="link-btn" id="share-close">Close</button>
</div>

<!-- Shared right-click menu, filled in per context when opened. -->
<div id="ctx" class="ctx"></div>

<!-- Shared confirmation, dropped beneath whichever control asked for it. -->
<div id="confirm" class="confirm">
  <span class="confirm-q">Are you sure?</span>
  <button type="button" class="link-btn confirm-yes">Yes</button>
  <button type="button" class="link-btn confirm-no">No</button>
</div>

<!-- Same popup treatment, but asking for an image URL. -->
<div id="paste-pop" class="confirm paste-pop">
  <input class="pp-input" type="url" placeholder="Paste image address" spellcheck="false">
  <button type="button" class="link-btn pp-add">Add</button>
  <button type="button" class="link-btn pp-cancel">Cancel</button>
</div>

<input type="file" id="import-file" accept="application/json" hidden>

<!-- Card template, cloned for each part -->
<template id="card-tpl">
  <article class="card">
    <div class="fields">
      <div class="row url-row">
        <input class="f-url" type="url" placeholder="Product URL" spellcheck="false">
      </div>

      <div class="thumb">
        <img class="shot" alt="" referrerpolicy="no-referrer" hidden>
        <div class="thumb-empty">
          <span>No image yet</span>
          <small>Paste a product URL above</small>
        </div>
        <div class="thumb-status" hidden></div>
        <!-- Drawn rather than typed: a chevron character sits off-centre in its
             em box, which threw the hover square off. The path is symmetric
             about the middle of the viewBox, so the two line up exactly. -->
        <button class="nav prev" aria-label="Previous image" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 4.5 L7.5 12 L16.5 19.5"/></svg>
        </button>
        <button class="nav next" aria-label="Next image" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5 L16.5 12 L7.5 19.5"/></svg>
        </button>
        <div class="counter" hidden></div>
        <!-- Mirrors the image counter opposite it: same dark capsule, which
             already reads over any product photo. -->
        <button type="button" class="status" data-status="Wishlist">Wishlist</button>
      </div>

      <div class="msg" hidden></div>

      <!-- Each field sits in a wrapper that carries the hover panel, so the
           field itself can be masked without fading that panel's edge. -->
      <div class="row meta-row">
        <!-- The type doubles as the name field's label: it says what kind of
             part this is, the field beside it says which one. -->
        <button type="button" class="f-label f-type" aria-label="Part type">
          <span class="ft-text">Part</span>
        </button>
        <span class="fw fw-title">
          <input class="f-title" type="text" placeholder="Name" spellcheck="false">
        </span>
        <span class="f-label">USD</span>
        <span class="fw fw-price">
          <input class="f-price" type="text" inputmode="decimal" placeholder="0.00">
        </span>
        <span class="f-label">Qty</span>
        <span class="fw fw-qty">
          <input class="f-qty" type="text" inputmode="numeric">
        </span>
      </div>

      <span class="fw fw-notes">
        <textarea class="f-notes" rows="2" placeholder="Notes (type, finish, vendor, ect.)"></textarea>
      </span>
    </div>

    <div class="card-tools">
      <a class="open" target="_blank" rel="noopener noreferrer" hidden>Open page &#8599;</a>
      <button class="link-btn manual">Paste image URL</button>

      <button class="link-btn del">Delete</button>
    </div>

    <!-- One connector per side, centred on the edge. -->
    <span class="port pl" data-side="l"></span>
    <span class="port pr" data-side="r"></span>
    <span class="port pt" data-side="t"></span>
    <span class="port pb" data-side="b"></span>

    <!-- Resize grips. The edge strips stop short of the middle and sit below
         the connectors in stacking order, so grabbing a dot still starts a
         wire rather than a resize. -->
    <span class="rz rz-n" data-dir="n"></span>
    <span class="rz rz-s" data-dir="s"></span>
    <span class="rz rz-w" data-dir="w"></span>
    <span class="rz rz-e" data-dir="e"></span>
    <span class="rz rz-nw" data-dir="nw"></span>
    <span class="rz rz-ne" data-dir="ne"></span>
    <span class="rz rz-sw" data-dir="sw"></span>
    <span class="rz rz-se" data-dir="se"></span>
  </article>
</template>

<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
